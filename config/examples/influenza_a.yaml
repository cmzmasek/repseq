# repseq config for Influenza A virus (NCBI Virus dataset)
# Usage examples:
#
#   # Global clustering at 90% identity, segmented mode on:
#   repseq global -c config/examples/influenza_a.yaml \
#       -i sequences/*.fasta --threshold 0.90 --segmented
#
#   # Taxonomic mode: up to 10 representatives per subtype (H3N2, H5N1, etc.):
#   repseq custom -c config/examples/influenza_a.yaml \
#       -i sequences/*.fasta --field subtype -n 10 --segmented
#
#   # Hybrid: 5 reps per subtype × host combination:
#   repseq hybrid -c config/examples/influenza_a.yaml \
#       -i sequences/*.fasta --fields subtype,host -n 5 --segmented
#
#   # Time-stratified: 20 reps per year:
#   repseq time -c config/examples/influenza_a.yaml \
#       -i sequences/*.fasta --n-per-window 20 --window year --segmented

cache_dir: ~/.repseq/cache
temp_dir: /tmp/repseq
threads: 8
seed: 42

qc:
  remove_duplicates: true
  length_filter:
    mode: median_percent
    min_percent: 50
  ambiguous_threshold: 0.02
  annotation_filter:
    enabled: true
    keywords:
      - "MAG:"
      - metagenome-assembled
      - synthetic
      - artificial
      - fragment
      - partial
      - environmental sample
      - uncultured
      - unclassified
      - unidentified
      - hypothetical
      - recombinant
      - chimeric

segmented:
  enabled: false   # activate with --segmented flag or set to true here
  virus: influenza_a
  viruses:
    influenza_a:
      expected_segments: 8
      # Segments in canonical order for concatenation
      segments:
        - PB2
        - PB1
        - PA
        - HA
        - NP
        - NA
        - M
        - NS
      # Regex to extract the isolate ID from NCBI Virus headers.
      # Captures: A/duck/Hong_Kong/1/1997, A/California/07/2009, etc.
      # Named group 'isolate' is preferred; falls back to group 1.
      isolate_regex: "(?P<isolate>[AB]/[^/(\\s]+/[^/(\\s]+/[^/(\\s]+/\\d{4})"
      # Optional: regex to identify segment from header
      # segment_regex: "segment\\s+(?P<segment>\\d+)"
      # Aliases: extra terms the segment-identifier should recognise as
      # a given canonical segment. Headers using the protein name rather
      # than the segment shorthand (e.g. "hemagglutinin gene" → HA) are
      # the main use case. Longer aliases are tried first, so multi-word
      # phrases ("polymerase basic 2") win over short tokens ("PB2").
      segment_aliases:
        PB2: ["polymerase basic 2", "polymerase PB2"]
        PB1: ["polymerase basic 1", "polymerase PB1"]
        PA:  ["polymerase acidic", "polymerase PA"]
        HA:  ["hemagglutinin", "haemagglutinin"]
        NP:  ["nucleoprotein", "nucleocapsid protein"]
        NA:  ["neuraminidase"]
        M:   ["matrix protein", "matrix gene", "MP"]
        NS:  ["nonstructural", "non-structural", "nuclear export protein"]
      # Expected protein count per segment. Each value may be either:
      #   - an int  : exact count required (strict)
      #   - a list  : any of the listed counts is acceptable (lenient)
      #
      # Influenza A protein counts are STRAIN-DEPENDENT. The canonical
      # counts below (PB1=2, PA=2, NS=2) assume the full accessory CDS set:
      #   PB1-F2: truncated/nonfunctional in many 2009 H1N1 pandemic strains
      #           → some RefSeq records annotate only the main PB1 CDS
      #   PA-X  : produced by ribosomal frameshift; not always annotated
      #   NEP/NS2 : alternative splice product, sometimes omitted
      # If you see your real isolates failing protein QC for PB1/PA/NS,
      # relax to [1, 2] for those segments.
      expected_proteins_per_segment:
        PB2: 1
        PB1: [1, 2]   # PB1 alone, or PB1 + PB1-F2
        PA:  [1, 2]   # PA alone, or PA + PA-X
        HA: 1
        NP: 1
        NA: 1
        M:  2         # M1 + M2 (M2 from spliced mRNA, normally always present)
        NS: [1, 2]    # NS1 alone, or NS1 + NEP/NS2

    influenza_b:
      expected_segments: 8
      segments:
        - PB2
        - PB1
        - PA
        - HA
        - NP
        - NA
        - M
        - NS
      isolate_regex: "(?P<isolate>B/[^/(\\s]+/[^/(\\s]+/\\d{4})"

    influenza_c:
      expected_segments: 7
      segments:
        - PB2
        - PB1
        - P3
        - HEF
        - NP
        - M
        - NS
      isolate_regex: "(?P<isolate>C/[^/(\\s]+/[^/(\\s]+/\\d{4})"

taxonomy:
  ncbi_email: null   # set your email here or via REPSEQ_NCBI_EMAIL env var
  ncbi_api_key: null # set your key here or via REPSEQ_NCBI_API_KEY env var
  cache_ttl_days: 30

clustering:
  backend: mmseqs2
  mmseqs2_mode: easy-linclust
  coverage: 0.8
  coverage_mode: 0
  extra_args: []

representative:
  priority:
    - refseq
    - reviewed_uniprot
    - longest

output:
  dir: ./repseq_output_influenza_a
  prefix: influenza_a
