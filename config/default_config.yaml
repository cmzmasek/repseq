# repseq default configuration
# Copy and modify this file for your project.
# Pass it to any command with: --config your_config.yaml
#
# Unknown keys are a HARD ERROR: repseq aborts before running if it finds a
# key it doesn't recognise (a typo, a renamed key, or a setting in the wrong
# section). The error names the key and suggests the one you likely meant.
# Need a personal annotation key? Prefix it with "_" (e.g. _my_note:) and
# repseq ignores it. Validate without running: repseq <mode> --dry-run -c ...

cache_dir: ~/.repseq/cache
temp_dir: /tmp/repseq
threads: 4
seed: 42

qc:
  remove_duplicates: true

  # Whole-genome length filter: drop input sequences outside absolute
  # nucleotide bounds. Both bounds are optional but at least one is required
  # when enabled. There is no relative/median mode — you must supply the
  # actual expected genome length range (this is intentional: a median taken
  # over a taxonomically mixed input is not meaningful).
  #
  # NON-SEGMENTED MODE ONLY. Setting enabled: true together with
  # segmented.enabled: true is a hard config error — segmented runs filter
  # per segment via segmented.viruses.<virus>.segment_lengths instead.
  genome_length_filter:
    enabled: false
    min: null    # e.g. 9000  (drop sequences shorter than this many nt)
    max: null    # e.g. 13000 (drop sequences longer than this many nt)

  # Maximum fraction of ambiguous characters allowed (applies to AA and NA)
  ambiguous_threshold: 0.05

  # Optional: drop sequences whose NCBI GenBank record has fewer than
  # min_proteins annotated CDS features. Requires network (skipped under --no-resolve).
  protein_annotation:
    enabled: false
    min_proteins: 1

  # Optional: amino-acid analogue of ambiguous_threshold. Drop a CDS protein
  # when the fraction of ambiguous residues (X/B/Z/J) in its translation
  # exceeds max_bad_fraction (an empty/absent translation counts as fully
  # bad). A bad protein fails its segment, which drops the whole isolate
  # (segmented mode) or the sequence (non-segmented). The presence-only
  # protein_annotation count check does not look at residues, so a segment
  # filled with garbage residues would otherwise pass. Runs immediately
  # before the HMM QC step. Requires network (force-fetches CDS translations
  # when enabled; skipped under --no-resolve).
  protein_quality:
    enabled: false
    max_bad_fraction: 0.05

  annotation_filter:
    enabled: true
    keywords:
      - "MAG:"
      - metagenome-assembled
      - synthetic
      - artificial
      - fragment
      - partial
      - environmental sample
      - uncultured
      - unclassified
      - unidentified
      - hypothetical

segmented:
  enabled: false
  # Set 'virus' to the key in 'viruses' that you want to use
  virus: null
  # Prefer GenBank source-feature qualifiers (/isolate, /strain, /segment)
  # over the header-regex parse. The regex still runs as a fallback when an
  # accession is missing, when the source is UniProt, when --no-resolve is
  # set, or when a record lacks the qualifier. Set to false to bypass the
  # GenBank lookup entirely (header-regex only — the v0.5.x behaviour).
  use_genbank_metadata: true
  # Per-isolate taxonomy-consistency check. Drops any isolate whose
  # segments disagree on the named taxonomy rank — useful for
  # filtering out reassortants and isolate-ID collisions where two
  # different viruses share the same /isolate label. On by default.
  # Set enabled: false to keep all isolates regardless of rank
  # agreement. Missing values are ignored — only *populated*
  # disagreeing labels trigger a drop.
  taxonomy_consistency:
    enabled: true
    rank: species
  # What to do when the strain-collision detector finds two or more
  # distinct accessions sharing the same strain-derived isolate_id
  # AND the same segment. This is the over-merge signature of the
  # /strain -> isolate_id fallback (GenBank /isolate absent, /strain
  # used as the grouping key). "warn" (default) prints one line per
  # collision to stderr and lets the pipeline continue; "drop" removes
  # every accession involved in any collision before completeness
  # filtering and records them in _qc_removed.tsv with reason
  # "strain_collision:<segment>".
  strain_collision_action: warn
  # What to do when an isolate carries segments outside the configured
  # `segments` list (e.g. an L/M/S virus that ends up with a fourth
  # segment, or a non-canonical segment identifier that identify_segment
  # couldn't map). "warn" (default) prints one line per affected isolate
  # to stderr and lets the isolate through with just its expected
  # segments (today's silent prune, but now visible). "drop" removes
  # the entire isolate (every segment lands in _qc_removed.tsv with
  # reason "extra_segments:<extras>") and increments
  # QCReport.removed_extra_segments (counted in isolates).
  extra_segments_action: warn
  # Schema for each virus entry:
  #   <name>:
  #     expected_segments: <int>
  #     segments: [<name>, <name>, ...]        # canonical order, used for concatenation
  #     isolate_regex: "<pattern>"             # must capture group 'isolate' or group 1
  #     segment_regex: "<pattern>"             # optional; falls back to header search
  #     segment_aliases:                       # optional; synonyms recognised in headers
  #       <canonical>: [<alias>, <alias>, ...] #   e.g. L: [large, "large segment"]
  #     expected_proteins_per_segment:         # optional; each value is int OR list[int]
  #       <segment_name>: <int>                #   exact count required
  #       <segment_name>: [<int>, <int>, ...]  #   any of these counts acceptable
  #     segment_lengths:                       # optional; per-segment length bounds
  #       <segment_name>:                      #   drop any isolate where this segment
  #         min: <int>                         #   is shorter than min or longer than max
  #         max: <int>                         #   (either bound is optional)
  #     cluster_protein:                       # optional; marker protein per segment
  #       <segment_name>:                      #   for protein-alphabet clustering. Each
  #         - <alias>                          #   list entry is an alias string OR a
  #         - {name: ..., aliases: [...], hmms: [<token>, <token>]}   # dict form.
  #                                            #   Aliases match case-insensitively
  #                                            #   (substring) against /product;
  #                                            #   when `hmms` is present, the HMM gate
  #                                            #   is authoritative (see segment_markers
  #                                            #   below for token semantics). First
  #                                            #   match wins; omitted → longest CDS.
  #     segment_markers:                       # v0.14.0 recommended form for HMM QC.
  #       <segment_name>:                      #   One spec per segment, with aliases
  #         aliases: [<alias>, <alias>]        #   AND/OR hmms. hmms is a list of TOKEN
  #         hmms: [<token>, <token>]           #   strings: "Name" for single-HMM, or
  #                                            #   "A--B--C" for multidomain (HMMs in
  #                                            #   N-to-C order — A is N-terminal, C
  #                                            #   C-terminal). Multiple tokens are
  #                                            #   ALTERNATIVE architectures (OR): the
  #                                            #   segment passes QC when SOME CDS
  #                                            #   satisfies ANY one token; the marker
  #                                            #   (longest satisfying CDS) is then
  #                                            #   chosen if alphabet=protein. See the
  #                                            #   top-level `hmm:` block for gate
  #                                            #   behaviour and cutoffs.
  #     extra_protein:                         # optional accessory proteins per segment
  #       <segment_name>:                      #   to extract / phylogenize but NOT use
  #         - {name: ..., aliases: [...], hmms: [<token>]}   # for clustering. Same dict
  #                                            #   schema as cluster_protein. `name:`
  #                                            #   is REQUIRED (keys the output
  #                                            #   filename) and must be unique across
  #                                            #   ALL extra_protein entries in this
  #                                            #   virus. Each entry emits an unaligned
  #                                            #   FASTA into
  #                                            #   {prefix}_extra_protein_fasta/, and
  #                                            #   under --per-protein-phylo also a
  #                                            #   tree into {prefix}_extra_protein/.
  #                                            #   Sparse-by-design: specs that no rep
  #                                            #   satisfies produce no file.
  # See config/examples/influenza_a.yaml for a worked example with
  # strain-aware list-valued counts.
  viruses: {}

taxonomy:
  # Set your NCBI email to avoid rate limiting (required for Entrez API)
  ncbi_email: null
  # Optional: NCBI API key for higher rate limits (10 req/s vs 3 req/s)
  ncbi_api_key: null
  # How long to keep cached entries before re-querying (days)
  cache_ttl_days: 30

clustering:
  # Two backends are supported:
  #   mmseqs2 — fast, scales to very large datasets, identity floor 0.0
  #   cdhit   — classic, slower (no linear-time mode); cd-hit-est refuses
  #             identity < 0.80, cd-hit (protein) refuses < 0.40
  # Identical numeric thresholds will NOT produce identical clusters
  # across backends — different alignment heuristics, different word-size
  # rules. Pick one and stick with it for a given reference set.
  backend: mmseqs2

  # Alphabet fed to the clustering backend.
  #
  # IMPORTANT: this setting ONLY chooses what the clustering backend
  # (mmseqs2 / cd-hit) sees. It does NOT disable:
  #   • GenBank CDS download (still runs — protein QC, phylogeny, and the
  #     per-protein TSV/FASTA outputs all rely on it),
  #   • protein-count QC (qc.protein_annotation.enabled),
  #   • the virus.expected_proteins_per_segment per-segment check.
  # All of those run on every isolate regardless of which alphabet you
  # choose here.
  #
  #   protein     — cluster on amino acid sequences. Default and recommended
  #                 for viral workflows: synonymous substitutions inflate NT
  #                 divergence by 30–40% with no biological signal, and
  #                 protein homology is reliable down to ~25–30% identity
  #                 vs ~50–60% for nucleotide. For segmented input, the
  #                 marker protein from each segment is concatenated in
  #                 canonical segments order. For non-segmented input, the
  #                 marker protein on each sequence is used. The marker is
  #                 the longest CDS by default, overridable via
  #                 cluster_protein (this block, non-segmented) or
  #                 segmented.viruses.<v>.cluster_protein (per segment).
  #   nucleotide  — cluster on the raw input sequence (the pre-0.6 behaviour).
  #                 Choose this for genome-level identity targets, when
  #                 input is non-coding, or for offline runs (--no-resolve).
  #
  # When alphabet_for_clustering=protein, repseq triggers a one-shot GenBank
  # CDS fetch if proteins are not already cached (results cached under
  # ncbi_proteins; shared with protein-annotation QC, so no duplicate round
  # trips). Under --no-resolve a 'protein' run aborts with an error — switch
  # to alphabet_for_clustering: nucleotide for fully offline runs.
  #
  # The CLI flag --alphabet-for-clustering protein|nucleotide overrides
  # this value when passed.
  alphabet_for_clustering: protein

  # Non-segmented marker-protein override. Each entry is EITHER:
  #   • a plain alias string (legacy form, alias-only):
  #         ["polymerase", "RNA-dependent RNA polymerase"]
  #   • a dict with HMM support (recommended when HMMs are available):
  #         - {name: "RdRp",  aliases: ["polymerase"],  hmms: ["RdRp_4"]}
  #         - {name: "Spike", aliases: ["spike"],
  #            hmms: ["CoV_S1--CoV_S2", "bCoV_S1_N--bCoV_S1_RBD--CoV_S2"]}
  #
  # The `hmms:` field is a list of TOKEN strings:
  #   • "Name"       — single-HMM token, satisfied by any CDS whose hit
  #                    to that HMM passes the configured cutoffs.
  #   • "A--B--C"    — multidomain token, satisfied only when a single
  #                    CDS has passing hits to all listed HMMs IN N-TO-C
  #                    ORDER (A most N-terminal, C most C-terminal),
  #                    with strict non-overlap between named domains.
  #                    Extra domains anywhere on the CDS are fine.
  #
  # N-to-C convention: the order in "A--B--C" reads N-to-C left-to-right,
  # the same direction molecular biology writes a protein sequence — so a
  # token mirrors the domain architecture as you'd draw it (e.g. the
  # coronavirus Spike is "CoV_S1--CoV_S2": S1 N-terminal, S2 C-terminal).
  # The named domains are matched against the hmmscan `ali_from`/`ali_to`
  # columns in that order.
  #
  # ALTERNATIVE ARCHITECTURES (OR): multiple tokens in ONE marker's `hmms:`
  # list are alternatives — a CDS that satisfies ANY one of them satisfies
  # the marker. This lets a single marker span divergent forms of the same
  # protein, e.g. the Spike example above accepts the alpha-CoV
  # "CoV_S1--CoV_S2" architecture OR the beta-CoV
  # "bCoV_S1_N--bCoV_S1_RBD--CoV_S2" architecture, so alpha and beta
  # coronaviruses can be analysed together under one Spike marker.
  #
  # When `hmms` is set AND `hmm.enabled=true` AND `hmmscan` is on PATH,
  # the HMM gate is AUTHORITATIVE for that marker: an upstream HMM-QC
  # step drops sequences/segments where the marker has NO satisfying CDS
  # (none of its alternative tokens matched), regardless of clustering
  # alphabet. In a non-segmented run with multiple HMM-defining specs in
  # this list, the sequence must satisfy EVERY such spec — across specs the
  # rule is AND (each spec is an independent marker to verify), while within
  # one spec's token list it is OR (alternative architectures). Specs that
  # only define `aliases:` (no `hmms:`) are advisory selection hints; they
  # do not gate QC.
  cluster_protein: []

  # Non-segmented multi-marker clustering. When false (default) the
  # clustering string is the SINGLE marker from the first cluster_protein
  # spec a CDS satisfies (e.g. Spike alone for coronaviruses). When true,
  # the marker CDS from EVERY cluster_protein spec is selected and the AA
  # strings are concatenated in declared spec order (e.g. Spike+
  # Nucleocapsid), mirroring the segmented per-segment concat. A sequence
  # missing any required marker is dropped (with HMM-gated specs the AND
  # gate already enforces this upstream). No effect in segmented mode
  # (which always concatenates its per-segment markers) or when
  # alphabet_for_clustering=nucleotide. NOTE: this only changes the
  # clustering input — the whole-genome tree is unaffected. For a
  # multi-gene tree set phylo.tool: auto/iqtree so the partitioned
  # supermatrix path aligns each marker separately.
  concatenate_markers: false

  # Additional proteins to extract (and, with --per-protein-phylo, tree)
  # but NOT use for clustering or the whole-genome tree. Same dict schema
  # as cluster_protein — each entry is `{name, aliases?, hmms?}` — but the
  # `name:` field is REQUIRED and must be unique across all entries in
  # this list (it keys the output filename). Example:
  #
  #   extra_protein:
  #     - {name: "Coronavirus protein 7",       aliases: [],     hmms: ["Corona_7"]}
  #     - {name: "Coronavirus small envelope protein E",
  #        aliases: ["E"], hmms: ["CoV_E"]}
  #
  # For every entry, the satisfying CDS (HMM-gated when `hmms:` is
  # declared and the HMM tier ran; alias fallback against /product
  # otherwise) is extracted from each representative and written
  # unaligned to {prefix}_extra_protein_fasta/{prefix}_<name>.fasta —
  # one file per entry. With --per-protein-phylo, each entry also
  # produces a tree (MSA, Newick, phyloXML, id-map) under
  # {prefix}_extra_protein/. extras are SPARSE BY DESIGN: a spec that
  # no representative satisfies produces no file (no warning either —
  # missing accessory proteins are expected). Names visible to the user
  # come from `name:` verbatim, sanitised for the filesystem
  # (whitespace → "_"). Segmented runs use the same key under
  # `segmented.viruses.<v>.extra_protein:` as a per-segment dict (see
  # `segmented.viruses` block above).
  extra_protein: []

  # Diagnostic "diversity curve" reporting. For each stratum where the
  # binary-search clustering ran (clustered=TRUE in
  # {prefix}_group_counts.tsv), the backend is also run at each of these
  # identity thresholds and the resulting cluster counts are reported as
  # additional columns (n_clusters_0.99, n_clusters_0.95, ...). This is
  # purely diagnostic — REPRESENTATIVE SELECTION IS NOT AFFECTED. It
  # gives a sense of how conserved each stratum is (e.g. does the group
  # collapse to 5 clusters at 0.99 or only at 0.70?). Cutoffs below the
  # backend's identity floor (cd-hit-est 0.80, cd-hit protein 0.40,
  # MMseqs2 0.0) are reported as NA in the TSV. Empty list disables the
  # feature — useful on very large runs where the extra clustering work
  # would dominate runtime.
  diversity_curve_cutoffs: [0.99, 0.95, 0.9, 0.8, 0.7]

  # ---- MMseqs2 backend options (used when backend == mmseqs2) ----
  # easy-linclust: linear-time, scales to very large datasets, but APPROXIMATE
  #   — it does not guarantee every pair within a cluster meets --min-seq-id,
  #   so clusters can be looser than the nominal threshold.
  # easy-cluster: cascaded all-vs-all, slower, but cluster membership
  #   actually respects the identity threshold.
  # For reference-set construction where cluster tightness matters, prefer
  # easy-cluster unless the dataset is too large for it to finish.
  mmseqs2_mode: easy-linclust
  coverage: 0.8
  # coverage_mode:
  #   0 = query+target coverage
  #   1 = target coverage
  #   2 = query coverage
  #   3 = target-in-query coverage
  #   4 = query-in-target coverage
  coverage_mode: 0
  extra_args: []

  # ---- cd-hit backend options (used when backend == cdhit) ----
  cdhit:
    # Binary auto-selected from input alphabet:
    #   protein  -> cd-hit
    #   nucleic  -> cd-hit-est
    # Set to a name or absolute path to override.
    binary: null
    # Word size (-n). null = auto-pick from threshold per cd-hit's table
    # (cd-hit refuses out-of-range -n for a given -c). Override only if
    # you know what you're doing.
    word_size: null
    # Shorter-sequence coverage (-aS); only honoured when global_alignment
    # is false. Analogous to mmseqs2.coverage above.
    coverage: 0.8
    # -G: true = global identity (cd-hit default), false = local.
    # Local lets short seqs match into longer clusters; -aS only applies
    # in local mode.
    global_alignment: true
    # -g: false = greedy (fast, default), true = compare each input
    # against every existing cluster (slower, better cluster assignment).
    accurate: false
    # -M: memory cap in MB (0 = unlimited).
    memory_mb: 0
    # Raw cd-hit flags appended verbatim, e.g. ["-s", "0.8"].
    extra_args: []

representative:
  # Ordered preference for selecting each cluster's representative. The order
  # is honoured: the first criterion wins, later ones break ties, and sequence
  # length is always the final tiebreaker. So [refseq, reviewed_uniprot,
  # longest] prefers a RefSeq, then a Swiss-Prot-reviewed entry, then the
  # longest; swapping the first two would prefer reviewed over RefSeq. Drop a
  # criterion to deactivate that preference. `longest` must be present.
  priority:
    - refseq
    - reviewed_uniprot
    - longest

# HMM-based identity QC (v0.14.0).
#
# Purpose: verify each segment (segmented mode) or sequence (non-
# segmented mode) actually carries the expected proteins, by HMM
# identity rather than GenBank /product strings. /product is inconsistent
# across viral families and submitters; HMM hits are reproducible.
# This step:
#   1. Auto-fetches CDS proteins from GenBank if not already cached.
#   2. Runs `hmmscan` against the configured HMM database in one batch.
#   3. For each segment/sequence, checks every configured marker spec
#      that defines `hmms:`. A spec's tokens are alternatives (OR): the
#      spec passes when SOME CDS satisfies ANY one of its tokens, and the
#      segment/sequence fails QC only when a spec has no satisfying CDS at
#      all; for segmented runs the whole isolate is then dropped.
#   4. Stashes hit data for downstream consumers (marker selection
#      when alphabet=protein, the `hmmscan` TSV column, the FASTA tag).
#
# Runs whenever this block is enabled AND any marker spec carries
# `hmms: [...]` — REGARDLESS of clustering alphabet. (In v0.13.0 the
# scan only fired on alphabet=protein runs; v0.14.0 promotes it to a
# first-class QC stage so nucleotide-clustering users also benefit.)
#
# Markers that do NOT define `hmms` keep the legacy alias → longest
# behaviour and are not gated by HMM-QC. HMMs can be phased in one
# marker at a time.
#
# Soft-fails: missing hmmscan binary, unreadable database, or
# hmm.enabled=false all bypass the step with a single stderr warning.
# Use `repseq doctor` to verify install state.
hmm:
  enabled: true
  # null → bundled viral-core profile set shipped with repseq
  # (repseq/data/hmms/repseq_viral_core.hmm — Pfam-A profiles for RdRp,
  # nucleocapsid, glycoprotein, helicase, protease across the main viral
  # families). Also accepts:
  #   • a path to a single .hmm FILE (user-supplied database);
  #   • a path to a DIRECTORY of .hmm files — every *.hmm in it is
  #     concatenated into one combined database (cached under cache_dir,
  #     rebuilt only when a member changes), so you can keep family-
  #     specific profiles as separate files;
  #   • a BARE NAME of a bundled family set under repseq/data/hmms/, e.g.
  #     `database: Filoviridae` → repseq/data/hmms/Filoviridae/ (a
  #     directory, combined as above).
  # Whatever resolves is auto-`hmmpress`-ed on first use if its .h3*
  # index files are missing or stale.
  database: null
  # E-value cutoff used for profiles that lack a curated Pfam GA
  # (gathering threshold). Hits with domain E-value ≤ this value pass.
  default_evalue: 1.0e-5
  # When true (recommended), use each profile's GA cutoff when the
  # profile carries one — much more sensitive/specific than a generic
  # E-value threshold. Falls back to default_evalue when GA is absent.
  use_ga_when_available: true
  # Length cutoff: the HMM-to-CDS alignment must span at least this
  # fraction of the HMM model length. Guards against tiny domain hits
  # being accepted as full marker matches. Both cutoffs (E-value AND
  # coverage) must pass for an HMM hit to be considered passing.
  relative_length_cutoff: 0.5
  # Multidomain-token overlap tolerance, in amino acids. For a token
  # like "CoV_S1--CoV_S2" the named domains must appear N-to-C on the
  # CDS with forward-progressing endpoints, but their boundaries may
  # overlap by up to this many residues at the seam. Default 30 is
  # comfortable for typical Pfam viral-glycoprotein profiles whose HMM
  # boundaries don't land exactly on the molecular cleavage site (e.g.
  # CoV S1/S2 across the furin site, bunya G1/G2). Set 0 to require
  # strict non-overlap (pre-v0.22 behaviour). Full containment is
  # ALWAYS rejected regardless of tolerance, so a single fused region
  # cannot masquerade as two distinct domains by matching two profiles
  # at the same span.
  multidomain_overlap_tolerance: 30
  # null → use top-level cfg.threads.
  threads: null

# Optional MSA + phylogeny step (triggered with --phylo on any mode command).
# Skipped automatically if fewer than 3 representatives survive selection.
# Output files: {prefix}_msa.fasta (short ids), {prefix}_tree.nwk (Newick,
# short ids), {prefix}_tree.xml (phyloXML, original names restored), and
# {prefix}_tree_id_map.tsv (short ↔ original mapping). The short-id rename
# avoids breaking MAFFT/FastTree on long, whitespace- or pipe-containing
# names; the mapping file lets you decode the MSA and Newick yourself.
phylo:
  # Tree-builder selection:
  #   "auto"     — IQ-TREE for protein alignments, FastTree for nucleotide.
  #                Matches each tool to what it's best at; the default.
  #   "iqtree"   — always IQ-TREE (slower; principled model selection
  #                via ModelFinder, ultrafast bootstrap support values)
  #   "fasttree" — always FastTree (faster, approximate-ML)
  tool: auto
  # Retain the plain-text Newick (*_tree.nwk) for every tree built this run
  # (whole-genome, per-protein / extra / segment, pre-cluster, partition).
  # Off by default to cut output clutter: the annotated phyloXML (*_tree.xml)
  # is a topological superset, and the short-id *_tree_id_map.tsv (which
  # decodes the retained *_msa.fasta leaves) is kept either way. The Newick
  # is still produced internally during the run (the phyloXML is re-parsed
  # from it; the incongruence RF table reads it), then deleted at the end
  # unless this is true. CLI override: --newick / --no-newick.
  newick: false
  # Render a graphical PDF + PNG of every phyloXML tree built this run
  # (whole-genome, per-protein / extra / segment, pre-cluster, partition).
  # On by default. Each *_tree.xml gets a sibling *_tree.pdf and *_tree.png:
  # a ladderized rectangular phylogram (matplotlib + Bio.Phylo) with
  # taxonomy-coloured leaf labels, a genus/subfamily legend, and branch-support
  # labels, reconstructed from the phyloXML. Soft-fails (one stderr line, no
  # figures) when matplotlib is missing — same as --plot; matplotlib is the
  # [viz] extra. CLI override: --pdf / --no-pdf.
  pdf: true
  mafft:
    # Raw mafft flags appended to "mafft --auto --thread N <input>".
    # Examples: ["--maxiterate", "1000"] for accurate L-INS-i;
    #           ["--retree", "1"] to speed a very large pass.
    extra_args: []
    # Pass --auto to MAFFT (size-adaptive strategy selection: FFT-NS-1
    # for huge inputs, FFT-NS-2 for medium, L-INS-i for small). Set to
    # false to drop --auto and rely purely on extra_args (e.g. pinning
    # FFT-NS-1 with extra_args: ["--retree", "1"]). The CLI flag
    # --fast forces this to false at runtime for a preliminary-run
    # tree build.
    use_auto: true
  # Optional alignment trimming (trimAl) for the whole-genome tree (2E),
  # between MAFFT and the tree-builder. OFF by default. When on,
  # {prefix}_msa.fasta becomes the trimmed (tree-input) alignment and the
  # raw MAFFT output is kept as {prefix}_msa_untrimmed.fasta. In partitioned
  # mode each per-family alignment is trimmed BEFORE concatenation, so the
  # partition charset ranges stay correct. Soft-fails (loud warning + builds
  # on the untrimmed alignment) when trimal is missing / errors / strips the
  # alignment to nothing. `repseq doctor` reports trimal as optional.
  trimal:
    enabled: false
    # trimAl method → the `-<mode>` flag. automated1 = trimAl's heuristic
    # best for ML-tree reconstruction; also: gappyout, strict, strictplus,
    # nogaps, noallgaps. Threshold trimming (-gt/-st/-cons) goes in extra_args.
    mode: automated1
    # Raw trimal flags appended verbatim, e.g. ["-gt", "0.8"].
    extra_args: []
  fasttree:
    # Raw FastTree flags. The substitution model is picked automatically:
    # default JTT for protein, "-nt -gtr" for nucleotide.
    # Example: ["-fastest"] for the quickest pass on very large MSAs.
    extra_args: []
  iqtree:
    # Binary auto-detected: tries iqtree2 first, then iqtree.
    # Set to a name or absolute path to pin a specific build.
    binary: null
    # Substitution model.
    #   MFP     — ModelFinder Plus: scans available models and picks
    #             the best by BIC, then infers the ML tree. Recommended
    #             for protein (JTT/WAG/LG/FLU/HIVb/... can change topology).
    #             Adds minutes for hundreds of reps.
    #   LG+G4   — pin LG matrix with gamma rate heterogeneity (fast,
    #             sane default for most viral proteins).
    #   JTT+G4  — pin JTT (FastTree's default; fastest).
    # Any model accepted by IQ-TREE's -m flag is allowed.
    model: MFP
    # Ultrafast bootstrap replicates.
    # 0 disables bootstrap (faster); IQ-TREE recommends >= 1000 for
    # interpretable branch-support values. Each replicate is a full tree
    # search, so this is the main runtime knob.
    ultrafast_bootstrap: 1000
    # Raw flags appended verbatim, e.g. ["-alrt", "1000"] for SH-aLRT
    # alongside UFBoot, or ["--allnni"] for thorough NNI search.
    extra_args: []
  # Partitioned-supermatrix tree — the principled multi-marker analysis.
  # When enabled AND the run resolves to protein + IQ-TREE AND the HMM tier
  # resolved >= 2 marker families, the whole-genome tree (2E) is built by
  # aligning each marker family SEPARATELY (one MAFFT per family), then
  # concatenating the per-family MSAs column-wise into a supermatrix and
  # letting IQ-TREE fit a substitution model PER partition. This replaces
  # gluing the markers into one string aligned under one model — which lets
  # MAFFT align unrelated proteins across segment seams and forces a single
  # model across genuinely different protein families. Outputs gain
  # {prefix}_partition.nex (NEXUS charsets) and {prefix}_msa_<family>.fasta
  # (per-family MSAs); {prefix}_msa.fasta becomes the supermatrix. Soft-falls
  # back to the legacy concat-then-align path when the run can't be
  # partitioned (FastTree, no HMM families, < 2 alignable families).
  partition:
    # Master switch. Default ON for protein + IQ-TREE runs. Set false to
    # force the legacy concat-then-align behaviour.
    enabled: true
    # IQ-TREE partition linkage (Chernomor et al. 2016):
    #   proportional — -p, edge-linked proportional: one shared branch-length
    #                  set + a per-partition rate multiplier. Standard default.
    #   equal        — -q, edge-equal: all partitions share branch lengths.
    #   unlinked     — -Q, edge-unlinked: each partition gets independent
    #                  branch lengths (most flexible; many more parameters).
    linkage: proportional
    # Optional per-family model pin, keyed by the family LABEL
    # (segment_token, e.g. L_RdRP_4 or M_Bunya_G1--Bunya_G2; no segment
    # prefix in non-segmented runs). Families absent here get MFP →
    # ModelFinder per partition. Example:
    #   models: {L_RdRP_4: "LG+G4", S_Bunya_nucleocap: "WAG+G4"}
    models: {}
  labeling:
    # Per-leaf display labels on the phyloXML tree.
    #
    # Supported placeholders:
    #   {species}, {genus}, {subgenus}, {subfamily}, {family},
    #   {order}, {class}, {phylum}     — taxonomy ranks
    #   {id}, {accession}              — sequence identifiers
    #   {host}, {strain}, {isolate_id} — isolate metadata
    #   {subtype}                      — viral serotype, e.g. influenza "H5N1"
    #   {country}, {date}, {year}      — geography / time
    #   {organism}                     — verbatim organism field
    #
    # Empty placeholders are dropped along with the immediately
    # preceding separator character (so the label never contains "||"
    # or trailing "|"). For segmented runs, if you ask for {strain}
    # but the GenBank record has no /strain qualifier, the writer
    # substitutes {isolate_id} — a single template works for both.
    format: "{species}|{id}|{host}"
    segmented_format: "{species}|{strain}|{host}"
    # Replace whitespace inside each placeholder's value with "_" so
    # the label survives Newick / phyloXML viewers that treat
    # whitespace as a token boundary. Separators in the template
    # itself are left alone.
    replace_whitespace: true
    # When false (default), an empty placeholder also eats the single
    # separator character before it. Set true to keep all separators
    # verbatim (useful for fixed-width labels in scripted post-processing).
    keep_separator_on_empty: false
  rooting:
    # FastTree and IQ-TREE produce unrooted trees; this step picks a
    # root before the phyloXML is written.
    #
    #   auto       — try taxonomy-guided → MAD → midpoint, first
    #                success wins. The most-likely-correct default.
    #   taxonomy   — root at the branch that best agrees with the
    #                resolved NCBI taxonomy (maximises mean LCA
    #                specificity of internal clades).
    #   mad        — Minimal Ancestor Deviation (Tria et al. 2017),
    #                pure-Python. Robust when taxonomy is sparse.
    #   midpoint   — Bio.Phylo's root_at_midpoint. Last-resort
    #                fallback; always succeeds.
    #   outgroup   — root on a user-specified accession or clade. Set
    #                ``outgroup`` and/or ``outgroup_rank`` below. A
    #                single accession roots at that leaf; a list of
    #                accessions (or every leaf matching outgroup_rank)
    #                roots at their MRCA. Falls back to midpoint with
    #                a stderr note when the spec matches no rep.
    #   none       — leave the tree as parsed (use when the input
    #                is already rooted upstream).
    method: auto
    # User-specified outgroup (only consulted when method=outgroup).
    # Accession matched case-insensitively against rep.accession,
    # rep.id, or rep.isolate_id. Example:
    #   outgroup: "AB123456"
    #   outgroup: ["AB123456", "CD789012"]
    outgroup: null
    # Outgroup by taxonomy rank — every rep whose taxonomy carries the
    # named taxon at the named rank is added to the outgroup set. Example:
    #   outgroup_rank: {family: "Hantaviridae"}
    # ``outgroup`` and ``outgroup_rank`` are unioned; multi-leaf outgroups
    # root at the MRCA of all matching leaves.
    outgroup_rank: null
  lca:
    # Internal-node LCA labels (lowest common ancestor of each clade's
    # terminals, read from the resolved NCBI lineage). Emitted in
    # phyloXML as <name> + <taxonomy><rank> on every internal clade.
    enabled: true
    # Leaves whose lineage doesn't reach this rank are excluded from
    # the LCA *vote* — they stay on the tree but don't pull internal
    # labels toward an over-coarse taxon. Default "genus" suits viral
    # data, where many leaves lack species-level classification.
    # "none" disables the gate entirely.
    min_rank: genus
    # An internal node is annotated only if at least this fraction of
    # its terminals carry usable lineage data. Guards against a
    # handful of well-annotated leaves dictating the label of a much
    # larger bare clade.
    coverage_threshold: 0.5
  taxonomy_review:
    # Phylogeny-based taxonomy review (OFF by default — a new scientific
    # inference). When enabled and --phylo built a tree, each
    # representative leaf is compared against the smallest well-supported,
    # taxonomically-pure clade enclosing it:
    #   • a BLANK rank is imputed from the clade's majority value;
    #   • a POPULATED rank that disagrees is FLAGGED (never auto-changed).
    # Writes {prefix}_taxonomy_review.tsv (the imputation/conflict ledger).
    # The tree, its colouring, and its LCA labels are NOT modified.
    enabled: false
    # Ranks to evaluate, coarse→fine (evaluated in that order so
    # imputations stay hierarchy-consistent). Species is omitted on
    # purpose — viral species monophyly is too often violated to trust.
    ranks: [family, genus, subgenus]
    # "high"-confidence bar. Only high-confidence imputations are written
    # into the corrected copies; everything down to a relaxed "medium" bar
    # still appears in the review TSV.
    min_support: 90          # enclosing-clade branch support (0-100)
    min_purity: 0.9          # fraction of labelled neighbours agreeing
    min_agreeing: 3          # min labelled neighbours backing the call
    require_refseq_anchor: true   # a RefSeq/reviewed leaf must be among them
    # Also write *_corrected copies of the rep TSV + protein FASTA with
    # high-confidence imputed blanks filled in (clean values; originals
    # kept untouched — the review TSV records which cells were filled).
    write_corrected: true
  conservation:
    # MSA conservation scoring (ON by default). After the phylo steps,
    # every alignment written this run (genome tree, partition per-family
    # alignments + supermatrix, per-protein trees, extra-protein /
    # polyprotein-peptide / per-segment trees) is scored for overall
    # conservation and the results collected into one file,
    # {prefix}_msa_conservation.tsv (one row per MSA). The metric is the
    # mean per-column Jensen-Shannon divergence to a residue background
    # (Capra & Singh 2007), with Henikoff & Henikoff (1994) sequence
    # weighting and a (1 - gap-fraction) gap penalty. Bounded [0,1]:
    # ~0 = unrelated/background columns; a perfectly conserved column
    # tops out near ~0.85-0.95 (protein) / ~0.55 (nucleotide) — the
    # JSD-to-background ceiling never reaches exactly 1. Comparable only
    # within an alphabet. A post-hoc sweep, so it never affects a tree;
    # writes nothing when no MSA was produced.
    enabled: true
  phyloxml:
    # <confidence> element's type= attribute. "auto" picks "sh_like" for
    # FastTree and "ufboot" for IQ-TREE (which matches the default tree
    # arguments). Override only if you've changed the tree arguments —
    # e.g. classical bootstrap → "bootstrap", IQ-TREE -alrt only → "sh_alrt".
    confidence_type: auto
  # Taxonomy-driven leaf colouring of the phyloXML tree. Each external
  # node gets a <property ref="style:font_color" datatype="xsd:token"
  # applies_to="node">#RRGGBB</property> so viewers (Archaeopteryx) tint
  # the leaf label by taxonomy. The palette is shared across the
  # whole-genome tree (2E) and every per-protein tree (2F), so the same
  # taxon is the same colour everywhere — which is what lets you spot
  # incongruence across the per-protein trees by eye.
  coloring:
    # Master switch. Default ON.
    enabled: true
    # One or two ranks. ONE rank (e.g. [genus]) → each value gets a
    # distinct hue, spaced around the wheel by the golden angle. TWO
    # ranks [parent, child] (e.g. [genus, subgenus]) → the child's values
    # fan out across a narrow band of hues around the parent's base
    # colour, so each subgenus reads as a shade of its genus. List the
    # coarser rank FIRST. Valid: species, subgenus, genus, subfamily,
    # family, suborder, order, subclass, class, phylum, kingdom,
    # superkingdom.
    ranks: [genus]
    # HSV saturation / value of the generated palette, in [0, 1].
    saturation: 0.65
    value: 0.90
    # Leaves whose rank is empty / unknown / na / n/a / none / ? / -
    # (case-insensitive) get this colour. Must be #RRGGBB. In two-rank
    # mode a known parent with a missing child keeps the parent's base
    # colour; only a missing parent goes grey.
    missing_color: "#808080"
  # Per-protein trees (2F) — enabled per-run with --per-protein-phylo.
  # Builds one tree per declared HMM marker (one tree per `hmms:` spec you
  # configure for QC under segment_markers / cluster_protein), written into
  # the {prefix}_per_protein/ subdirectory. A spec's `hmms:` tokens are
  # alternative architectures (OR): a representative whose CDS satisfies ANY
  # one of them becomes a leaf, so divergent forms of the same protein
  # (e.g. alpha- and beta-CoV Spike) share one tree. Each tree is named
  # after the spec's `name:` (e.g. "Spike"), or its token when unnamed,
  # segment-prefixed in segmented mode. Requires the HMM tier to have run
  # (hmm.enabled + configured hmms:).
  per_protein:
    # A family (marker) is only built into a tree when at least this many
    # representatives carry the architecture. Clamped to a floor of 3
    # (neither IQ-TREE nor FastTree builds a tree on fewer).
    min_taxa: 3
    # After the per-protein trees are built, write a pairwise unrooted
    # Robinson-Foulds (RF) distance table, {prefix}_incongruence.tsv,
    # under {prefix}_per_protein/. Columns: tree_a, tree_b, rf, norm_rf,
    # n_common_taxa. RF is computed on each pair's shared taxa and
    # ignores rooting; rf=0 means identical unrooted topology, higher =
    # more incongruent. norm_rf = rf / (2*(n-3)) for n>=4 common taxa,
    # else NA. When --phylo also ran, the whole-genome tree is included
    # as an extra "GENOME" row set. High RF between marker trees is the
    # reassortment / recombination signal. Needs >= 2 trees to compare.
    # Set false to skip the table.
    incongruence: true
    # MAFFT options for the per-protein (single-gene) alignments.
    # Default is empty -> MAFFT --auto (fast, size-adaptive), same as the
    # whole-genome tree. For a high-accuracy publication run, set this to
    # ["--maxiterate", "1000", "--localpair"] (L-INS-i) — affordable on
    # these small single-gene alignments but noticeably slower, hence
    # opt-in. A non-empty list is passed to MAFFT WITHOUT --auto so the
    # explicit strategy takes effect.
    mafft:
      extra_args: []
    # Emit a phyloXML <domain_architecture> on each per-protein tree leaf,
    # built from that CDS's HMM hits — every hit, with its E-value as the
    # domain confidence, so a viewer (Archaeopteryx) can draw the domain
    # boxes and filter them with its interactive E-value slider. Default
    # on; set false to omit the domain blocks.
    domain_architecture: true
    # In addition to the per-mature-peptide trees, build ONE tree per declared
    # polyprotein spec on the WHOLE polyprotein CDS (e.g. all of ORF1ab), one
    # leaf per representative carrying it. The point is the phyloXML
    # <domain_architecture>: every HMM hit across the whole polyprotein is
    # drawn as a domain box, so a leaf shows the full nsp/peptide layout
    # end-to-end. OFF by default (one extra large alignment + tree per spec);
    # only fires when --per-protein-phylo runs with a polyprotein spec and the
    # HMM tier is active. Outputs {prefix}_<spec>_polyprotein_tree.{xml,pdf,png}
    # in {prefix}_polyprotein/. (The unaligned {prefix}_<spec>_polyprotein.fasta
    # is written regardless of this knob, parallel to the per-peptide FASTAs.)
    whole_polyprotein_tree: false
    # Optional trimAl trimming for the per-protein (single-gene) alignments,
    # independent of the whole-genome phylo.trimal. OFF by default; same
    # shape and same soft-fail behaviour.
    trimal:
      enabled: false
      mode: automated1
      extra_args: []

output:
  dir: ./repseq_output
  prefix: repseq

  # `{prefix}_protein_taxonomic_report.txt` controls. The file lists,
  # per taxonomic rank (subgenus → class), how many isolates/sequences
  # in each taxon carry each declared protein (`cluster_protein` and
  # `extra_protein`) and the length stats (min/max/median/IQR aa) of
  # those proteins. Ranks with more than `max_breakdown` distinct taxa
  # are truncated to the top-N by member count with a "+N more taxa
  # not shown" line, so the file stays readable on a terminal. Raise
  # for publication runs where the full per-rank table is expected.
  protein_report:
    max_breakdown: 20

# ---------------------------------------------------------------------------
# Overrides — sequences of special importance
# ---------------------------------------------------------------------------
# `protect_qc` force-keeps the named sequences through the QC removal stages
# they would otherwise fail (a whitelist), so a curated reference strain is
# never silently dropped. Matching is by accession (non-segmented) or
# isolate_id (segmented), case- and version-insensitive (NC_045512 matches
# NC_045512.2 and vice versa). In segmented mode you typically list
# isolate_ids; note the early QC stages (ambiguous, annotation) run before
# isolate_id is populated, so those match on accession only. Every rescued
# record — and the reason it would have been removed — is written to
# `{prefix}_overrides.tsv` and described in `{prefix}_summary.md`, so
# protection is never silent. Default off (empty list = no-op).
overrides:
  # ids: inline list of accessions / isolate-ids of special importance.
  ids: []
  # ids_file: path to a file with one accession/isolate-id per line
  # ('#' comments and blank lines ignored); unioned with `ids`.
  ids_file: null
  # protect_qc: turn the force-keep whitelist on.
  protect_qc: false
  # protect_stages: which QC removal stages to protect against. Either the
  # string "all", or a list naming any of:
  #   duplicates, length, ambiguous, annotation, protein_count,
  #   taxonomy_consistency, protein_quality, hmm
  # (Segmented completeness is NOT protectable — protection cannot
  # synthesize a missing segment, so an incomplete isolate still drops.)
  protect_stages: all
  # force_select: guarantee the named sequences appear among the
  # representatives, independent of protect_qc. Hybrid policy: a pinned
  # sequence wins its cluster's representative slot (beating the
  # refseq/reviewed/longest priority); pinned members that collide in one
  # cluster are split into singleton clusters so all survive; pins that
  # clustering deselected (diversity `global -n`) are added as singletons.
  # Force-select needs the sequence to survive QC first — pair with
  # protect_qc (same id list) for a "present no matter what" guarantee; a
  # pin that didn't survive QC is reported as `unavailable`. Per-sequence
  # actions are written to {prefix}_force_selected.tsv. CLI: --pin-ids FILE.
  force_select: false
