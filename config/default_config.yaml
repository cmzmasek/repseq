# repseq default configuration
# Copy and modify this file for your project.
# Pass it to any command with: --config your_config.yaml

cache_dir: ~/.repseq/cache
temp_dir: /tmp/repseq
threads: 4
seed: 42

qc:
  remove_duplicates: true

  # Whole-genome length filter: drop input sequences outside absolute
  # nucleotide bounds. Both bounds are optional but at least one is required
  # when enabled. There is no relative/median mode — you must supply the
  # actual expected genome length range (this is intentional: a median taken
  # over a taxonomically mixed input is not meaningful).
  #
  # NON-SEGMENTED MODE ONLY. Setting enabled: true together with
  # segmented.enabled: true is a hard config error — segmented runs filter
  # per segment via segmented.viruses.<virus>.segment_lengths instead.
  genome_length_filter:
    enabled: false
    min: null    # e.g. 9000  (drop sequences shorter than this many nt)
    max: null    # e.g. 13000 (drop sequences longer than this many nt)

  # Maximum fraction of ambiguous characters allowed (applies to AA and NA)
  ambiguous_threshold: 0.05

  # Optional: drop sequences whose NCBI GenBank record has fewer than
  # min_proteins annotated CDS features. Requires network (skipped under --no-resolve).
  protein_annotation:
    enabled: false
    min_proteins: 1

  # Optional: amino-acid analogue of ambiguous_threshold. Drop a CDS protein
  # when the fraction of ambiguous residues (X/B/Z/J) in its translation
  # exceeds max_bad_fraction (an empty/absent translation counts as fully
  # bad). A bad protein fails its segment, which drops the whole isolate
  # (segmented mode) or the sequence (non-segmented). The presence-only
  # protein_annotation count check does not look at residues, so a segment
  # filled with garbage residues would otherwise pass. Runs immediately
  # before the HMM QC step. Requires network (force-fetches CDS translations
  # when enabled; skipped under --no-resolve).
  protein_quality:
    enabled: false
    max_bad_fraction: 0.05

  annotation_filter:
    enabled: true
    keywords:
      - "MAG:"
      - metagenome-assembled
      - synthetic
      - artificial
      - fragment
      - partial
      - environmental sample
      - uncultured
      - unclassified
      - unidentified
      - hypothetical

segmented:
  enabled: false
  # Set 'virus' to the key in 'viruses' that you want to use
  virus: null
  # Prefer GenBank source-feature qualifiers (/isolate, /strain, /segment)
  # over the header-regex parse. The regex still runs as a fallback when an
  # accession is missing, when the source is UniProt, when --no-resolve is
  # set, or when a record lacks the qualifier. Set to false to bypass the
  # GenBank lookup entirely (header-regex only — the v0.5.x behaviour).
  use_genbank_metadata: true
  # Per-isolate taxonomy-consistency check. Drops any isolate whose
  # segments disagree on the named taxonomy rank — useful for
  # filtering out reassortants and isolate-ID collisions where two
  # different viruses share the same /isolate label. On by default.
  # Set enabled: false to keep all isolates regardless of rank
  # agreement. Missing values are ignored — only *populated*
  # disagreeing labels trigger a drop.
  taxonomy_consistency:
    enabled: true
    rank: species
  # What to do when the strain-collision detector finds two or more
  # distinct accessions sharing the same strain-derived isolate_id
  # AND the same segment. This is the over-merge signature of the
  # /strain -> isolate_id fallback (GenBank /isolate absent, /strain
  # used as the grouping key). "warn" (default) prints one line per
  # collision to stderr and lets the pipeline continue; "drop" removes
  # every accession involved in any collision before completeness
  # filtering and records them in _qc_removed.tsv with reason
  # "strain_collision:<segment>".
  strain_collision_action: warn
  # What to do when an isolate carries segments outside the configured
  # `segments` list (e.g. an L/M/S virus that ends up with a fourth
  # segment, or a non-canonical segment identifier that identify_segment
  # couldn't map). "warn" (default) prints one line per affected isolate
  # to stderr and lets the isolate through with just its expected
  # segments (today's silent prune, but now visible). "drop" removes
  # the entire isolate (every segment lands in _qc_removed.tsv with
  # reason "extra_segments:<extras>") and increments
  # QCReport.removed_extra_segments (counted in isolates).
  extra_segments_action: warn
  # Schema for each virus entry:
  #   <name>:
  #     expected_segments: <int>
  #     segments: [<name>, <name>, ...]        # canonical order, used for concatenation
  #     isolate_regex: "<pattern>"             # must capture group 'isolate' or group 1
  #     segment_regex: "<pattern>"             # optional; falls back to header search
  #     segment_aliases:                       # optional; synonyms recognised in headers
  #       <canonical>: [<alias>, <alias>, ...] #   e.g. L: [large, "large segment"]
  #     expected_proteins_per_segment:         # optional; each value is int OR list[int]
  #       <segment_name>: <int>                #   exact count required
  #       <segment_name>: [<int>, <int>, ...]  #   any of these counts acceptable
  #     segment_lengths:                       # optional; per-segment length bounds
  #       <segment_name>:                      #   drop any isolate where this segment
  #         min: <int>                         #   is shorter than min or longer than max
  #         max: <int>                         #   (either bound is optional)
  #     cluster_protein:                       # optional; marker protein per segment
  #       <segment_name>:                      #   for protein-alphabet clustering. Each
  #         - <alias>                          #   list entry is an alias string OR a
  #         - {name: ..., aliases: [...], hmms: [<token>, <token>]}   # dict form.
  #                                            #   Aliases match case-insensitively
  #                                            #   (substring) against /product;
  #                                            #   when `hmms` is present, the HMM gate
  #                                            #   is authoritative (see segment_markers
  #                                            #   below for token semantics). First
  #                                            #   match wins; omitted → longest CDS.
  #     segment_markers:                       # v0.14.0 recommended form for HMM QC.
  #       <segment_name>:                      #   One spec per segment, with aliases
  #         aliases: [<alias>, <alias>]        #   AND/OR hmms. hmms is a list of TOKEN
  #         hmms: [<token>, <token>]           #   strings: "Name" for single-HMM, or
  #                                            #   "A--B--C" for multidomain (HMMs in
  #                                            #   C-to-N order — A is C-terminal, C
  #                                            #   N-terminal). Each token must be
  #                                            #   satisfied by at least one CDS in
  #                                            #   the segment for QC to pass; the
  #                                            #   marker (longest satisfying CDS) is
  #                                            #   then chosen if alphabet=protein.
  #                                            #   See the top-level `hmm:` block for
  #                                            #   gate behaviour and cutoffs.
  # See config/examples/influenza_a.yaml for a worked example with
  # strain-aware list-valued counts.
  viruses: {}

taxonomy:
  # Set your NCBI email to avoid rate limiting (required for Entrez API)
  ncbi_email: null
  # Optional: NCBI API key for higher rate limits (10 req/s vs 3 req/s)
  ncbi_api_key: null
  # How long to keep cached entries before re-querying (days)
  cache_ttl_days: 30

clustering:
  # Two backends are supported:
  #   mmseqs2 — fast, scales to very large datasets, identity floor 0.0
  #   cdhit   — classic, slower (no linear-time mode); cd-hit-est refuses
  #             identity < 0.80, cd-hit (protein) refuses < 0.40
  # Identical numeric thresholds will NOT produce identical clusters
  # across backends — different alignment heuristics, different word-size
  # rules. Pick one and stick with it for a given reference set.
  backend: mmseqs2

  # Alphabet fed to the clustering backend.
  #
  # IMPORTANT: this setting ONLY chooses what the clustering backend
  # (mmseqs2 / cd-hit) sees. It does NOT disable:
  #   • GenBank CDS download (still runs — protein QC, phylogeny, and the
  #     per-protein TSV/FASTA outputs all rely on it),
  #   • protein-count QC (qc.protein_annotation.enabled),
  #   • the virus.expected_proteins_per_segment per-segment check.
  # All of those run on every isolate regardless of which alphabet you
  # choose here.
  #
  #   protein     — cluster on amino acid sequences. Default and recommended
  #                 for viral workflows: synonymous substitutions inflate NT
  #                 divergence by 30–40% with no biological signal, and
  #                 protein homology is reliable down to ~25–30% identity
  #                 vs ~50–60% for nucleotide. For segmented input, the
  #                 marker protein from each segment is concatenated in
  #                 canonical segments order. For non-segmented input, the
  #                 marker protein on each sequence is used. The marker is
  #                 the longest CDS by default, overridable via
  #                 cluster_protein (this block, non-segmented) or
  #                 segmented.viruses.<v>.cluster_protein (per segment).
  #   nucleotide  — cluster on the raw input sequence (the pre-0.6 behaviour).
  #                 Choose this for genome-level identity targets, when
  #                 input is non-coding, or for offline runs (--no-resolve).
  #
  # When alphabet_for_clustering=protein, repseq triggers a one-shot GenBank
  # CDS fetch if proteins are not already cached (results cached under
  # ncbi_proteins; shared with protein-annotation QC, so no duplicate round
  # trips). Under --no-resolve a 'protein' run aborts with an error — switch
  # to alphabet_for_clustering: nucleotide for fully offline runs.
  #
  # The CLI flag --alphabet-for-clustering protein|nucleotide overrides
  # this value when passed.
  alphabet_for_clustering: protein

  # Non-segmented marker-protein override. Each entry is EITHER:
  #   • a plain alias string (legacy form, alias-only):
  #         ["polymerase", "RNA-dependent RNA polymerase"]
  #   • a dict with HMM support (recommended when HMMs are available):
  #         - {name: "RdRp",  aliases: ["polymerase"],  hmms: ["RdRp_4"]}
  #         - {name: "Spike", aliases: ["spike"],       hmms: ["Corona_S1--Corona_S2"]}
  #
  # The `hmms:` field is a list of TOKEN strings (v0.14.0+ semantic):
  #   • "Name"       — single-HMM token, satisfied by any CDS whose hit
  #                    to that HMM passes the configured cutoffs.
  #   • "A--B--C"    — multidomain token, satisfied only when a single
  #                    CDS has passing hits to all listed HMMs IN C-TO-N
  #                    ORDER (A most C-terminal, C most N-terminal),
  #                    with strict non-overlap between named domains.
  #                    Extra domains anywhere on the CDS are fine.
  #
  # IMPORTANT — C-to-N convention: the order in "A--B--C" reads C-to-N
  # left-to-right. Most molecular-biology notation is N-to-C, so triple-
  # check the order against the actual domain architecture before running.
  # The convention exists so multidomain tokens can be checked directly
  # against the hmmscan `ali_from`/`ali_to` columns without flipping.
  #
  # When `hmms` is set AND `hmm.enabled=true` AND `hmmscan` is on PATH,
  # the HMM gate is AUTHORITATIVE for that marker: an upstream HMM-QC
  # step (new in v0.14.0) drops sequences/segments where any required
  # token has no satisfying CDS, regardless of clustering alphabet.
  # In a non-segmented run with multiple HMM-defining specs in this
  # list, the sequence must satisfy EVERY such spec (each spec is an
  # independent marker the user wants verified). Specs that only define
  # `aliases:` (no `hmms:`) are advisory selection hints; they do not
  # gate QC.
  #
  # HARD CUTOVER from v0.13.0: ``hmms: [A, B]`` no longer means "A AND B
  # on the same CDS" — that's now two separate single-HMM tokens (loose).
  # To get the v0.13.0 strict-AND semantic, write ``hmms: ["A--B"]``.
  cluster_protein: []

  # Diagnostic "diversity curve" reporting. For each stratum where the
  # binary-search clustering ran (clustered=TRUE in
  # {prefix}_group_counts.tsv), the backend is also run at each of these
  # identity thresholds and the resulting cluster counts are reported as
  # additional columns (n_clusters_0.99, n_clusters_0.95, ...). This is
  # purely diagnostic — REPRESENTATIVE SELECTION IS NOT AFFECTED. It
  # gives a sense of how conserved each stratum is (e.g. does the group
  # collapse to 5 clusters at 0.99 or only at 0.70?). Cutoffs below the
  # backend's identity floor (cd-hit-est 0.80, cd-hit protein 0.40,
  # MMseqs2 0.0) are reported as NA in the TSV. Empty list disables the
  # feature — useful on very large runs where the extra clustering work
  # would dominate runtime.
  diversity_curve_cutoffs: [0.99, 0.95, 0.9, 0.8, 0.7]

  # ---- MMseqs2 backend options (used when backend == mmseqs2) ----
  # easy-linclust: linear-time, scales to very large datasets, but APPROXIMATE
  #   — it does not guarantee every pair within a cluster meets --min-seq-id,
  #   so clusters can be looser than the nominal threshold.
  # easy-cluster: cascaded all-vs-all, slower, but cluster membership
  #   actually respects the identity threshold.
  # For reference-set construction where cluster tightness matters, prefer
  # easy-cluster unless the dataset is too large for it to finish.
  mmseqs2_mode: easy-linclust
  coverage: 0.8
  # coverage_mode:
  #   0 = query+target coverage
  #   1 = target coverage
  #   2 = query coverage
  #   3 = target-in-query coverage
  #   4 = query-in-target coverage
  coverage_mode: 0
  extra_args: []

  # ---- cd-hit backend options (used when backend == cdhit) ----
  cdhit:
    # Binary auto-selected from input alphabet:
    #   protein  -> cd-hit
    #   nucleic  -> cd-hit-est
    # Set to a name or absolute path to override.
    binary: null
    # Word size (-n). null = auto-pick from threshold per cd-hit's table
    # (cd-hit refuses out-of-range -n for a given -c). Override only if
    # you know what you're doing.
    word_size: null
    # Shorter-sequence coverage (-aS); only honoured when global_alignment
    # is false. Analogous to mmseqs2.coverage above.
    coverage: 0.8
    # -G: true = global identity (cd-hit default), false = local.
    # Local lets short seqs match into longer clusters; -aS only applies
    # in local mode.
    global_alignment: true
    # -g: false = greedy (fast, default), true = compare each input
    # against every existing cluster (slower, better cluster assignment).
    accurate: false
    # -M: memory cap in MB (0 = unlimited).
    memory_mb: 0
    # Raw cd-hit flags appended verbatim, e.g. ["-s", "0.8"].
    extra_args: []

representative:
  # Priority order for selecting cluster representatives.
  # refseq > reviewed_uniprot > longest (length is always the final tiebreaker)
  priority:
    - refseq
    - reviewed_uniprot
    - longest

# HMM-based identity QC (v0.14.0).
#
# Purpose: verify each segment (segmented mode) or sequence (non-
# segmented mode) actually carries the expected proteins, by HMM
# identity rather than GenBank /product strings. /product is inconsistent
# across viral families and submitters; HMM hits are reproducible.
# This step:
#   1. Auto-fetches CDS proteins from GenBank if not already cached.
#   2. Runs `hmmscan` against the configured HMM database in one batch.
#   3. For each segment/sequence, checks every configured marker spec
#      that defines `hmms:`. If any token in a spec has no satisfying
#      CDS, the segment/sequence fails QC; for segmented runs the whole
#      isolate is then dropped.
#   4. Stashes hit data for downstream consumers (marker selection
#      when alphabet=protein, the `hmmscan` TSV column, the FASTA tag).
#
# Runs whenever this block is enabled AND any marker spec carries
# `hmms: [...]` — REGARDLESS of clustering alphabet. (In v0.13.0 the
# scan only fired on alphabet=protein runs; v0.14.0 promotes it to a
# first-class QC stage so nucleotide-clustering users also benefit.)
#
# Markers that do NOT define `hmms` keep the legacy alias → longest
# behaviour and are not gated by HMM-QC. HMMs can be phased in one
# marker at a time.
#
# Soft-fails: missing hmmscan binary, unreadable database, or
# hmm.enabled=false all bypass the step with a single stderr warning.
# Use `repseq doctor` to verify install state.
hmm:
  enabled: true
  # null → use the bundled viral-core profile set shipped with repseq
  # (repseq/data/hmms/repseq_viral_core.hmm — ~18 Pfam-A profiles for
  # RdRp, nucleocapsid, glycoprotein, helicase, protease across the
  # main viral families). Absolute path → user-supplied .hmm file;
  # auto-`hmmpress`-ed on first use if the .h3* index files are missing.
  database: null
  # E-value cutoff used for profiles that lack a curated Pfam GA
  # (gathering threshold). Hits with domain E-value ≤ this value pass.
  default_evalue: 1.0e-5
  # When true (recommended), use each profile's GA cutoff when the
  # profile carries one — much more sensitive/specific than a generic
  # E-value threshold. Falls back to default_evalue when GA is absent.
  use_ga_when_available: true
  # Length cutoff: the HMM-to-CDS alignment must span at least this
  # fraction of the HMM model length. Guards against tiny domain hits
  # being accepted as full marker matches. Both cutoffs (E-value AND
  # coverage) must pass for an HMM hit to be considered passing.
  relative_length_cutoff: 0.5
  # null → use top-level cfg.threads.
  threads: null

# Optional MSA + phylogeny step (triggered with --phylo on any mode command).
# Skipped automatically if fewer than 3 representatives survive selection.
# Output files: {prefix}_msa.fasta (short ids), {prefix}_tree.nwk (Newick,
# short ids), {prefix}_tree.xml (phyloXML, original names restored), and
# {prefix}_tree_id_map.tsv (short ↔ original mapping). The short-id rename
# avoids breaking MAFFT/FastTree on long, whitespace- or pipe-containing
# names; the mapping file lets you decode the MSA and Newick yourself.
phylo:
  # Tree-builder selection:
  #   "auto"     — IQ-TREE for protein alignments, FastTree for nucleotide.
  #                Matches each tool to what it's best at; the default.
  #   "iqtree"   — always IQ-TREE (slower; principled model selection
  #                via ModelFinder, ultrafast bootstrap support values)
  #   "fasttree" — always FastTree (faster, approximate-ML)
  tool: auto
  mafft:
    # Raw mafft flags appended to "mafft --auto --thread N <input>".
    # Examples: ["--maxiterate", "1000"] for accurate L-INS-i;
    #           ["--retree", "1"] to speed a very large pass.
    extra_args: []
  fasttree:
    # Raw FastTree flags. The substitution model is picked automatically:
    # default JTT for protein, "-nt -gtr" for nucleotide.
    # Example: ["-fastest"] for the quickest pass on very large MSAs.
    extra_args: []
  iqtree:
    # Binary auto-detected: tries iqtree2 first, then iqtree.
    # Set to a name or absolute path to pin a specific build.
    binary: null
    # Substitution model.
    #   MFP     — ModelFinder Plus: scans available models and picks
    #             the best by BIC, then infers the ML tree. Recommended
    #             for protein (JTT/WAG/LG/FLU/HIVb/... can change topology).
    #             Adds minutes for hundreds of reps.
    #   LG+G4   — pin LG matrix with gamma rate heterogeneity (fast,
    #             sane default for most viral proteins).
    #   JTT+G4  — pin JTT (FastTree's default; fastest).
    # Any model accepted by IQ-TREE's -m flag is allowed.
    model: MFP
    # Ultrafast bootstrap replicates.
    # 0 disables bootstrap (faster); IQ-TREE recommends >= 1000 for
    # interpretable branch-support values. Each replicate is a full tree
    # search, so this is the main runtime knob.
    ultrafast_bootstrap: 1000
    # Raw flags appended verbatim, e.g. ["-alrt", "1000"] for SH-aLRT
    # alongside UFBoot, or ["--allnni"] for thorough NNI search.
    extra_args: []
  labeling:
    # Per-leaf display labels on the phyloXML tree.
    #
    # Supported placeholders:
    #   {species}, {genus}, {subgenus}, {subfamily}, {family},
    #   {order}, {class}, {phylum}     — taxonomy ranks
    #   {id}, {accession}              — sequence identifiers
    #   {host}, {strain}, {isolate_id} — isolate metadata
    #   {country}, {date}, {year}      — geography / time
    #   {organism}                     — verbatim organism field
    #
    # Empty placeholders are dropped along with the immediately
    # preceding separator character (so the label never contains "||"
    # or trailing "|"). For segmented runs, if you ask for {strain}
    # but the GenBank record has no /strain qualifier, the writer
    # substitutes {isolate_id} — a single template works for both.
    format: "{species}|{id}|{host}"
    segmented_format: "{species}|{strain}|{host}"
    # Replace whitespace inside each placeholder's value with "_" so
    # the label survives Newick / phyloXML viewers that treat
    # whitespace as a token boundary. Separators in the template
    # itself are left alone.
    replace_whitespace: true
    # When false (default), an empty placeholder also eats the single
    # separator character before it. Set true to keep all separators
    # verbatim (useful for fixed-width labels in scripted post-processing).
    keep_separator_on_empty: false
  rooting:
    # FastTree and IQ-TREE produce unrooted trees; this step picks a
    # root before the phyloXML is written.
    #
    #   auto       — try taxonomy-guided → MAD → midpoint, first
    #                success wins. The most-likely-correct default.
    #   taxonomy   — root at the branch that best agrees with the
    #                resolved NCBI taxonomy (maximises mean LCA
    #                specificity of internal clades).
    #   mad        — Minimal Ancestor Deviation (Tria et al. 2017),
    #                pure-Python. Robust when taxonomy is sparse.
    #   midpoint   — Bio.Phylo's root_at_midpoint. Last-resort
    #                fallback; always succeeds.
    #   none       — leave the tree as parsed (use when the input
    #                is already rooted, e.g. by an outgroup).
    method: auto
  lca:
    # Internal-node LCA labels (lowest common ancestor of each clade's
    # terminals, read from the resolved NCBI lineage). Emitted in
    # phyloXML as <name> + <taxonomy><rank> on every internal clade.
    enabled: true
    # Leaves whose lineage doesn't reach this rank are excluded from
    # the LCA *vote* — they stay on the tree but don't pull internal
    # labels toward an over-coarse taxon. Default "genus" suits viral
    # data, where many leaves lack species-level classification.
    # "none" disables the gate entirely.
    min_rank: genus
    # An internal node is annotated only if at least this fraction of
    # its terminals carry usable lineage data. Guards against a
    # handful of well-annotated leaves dictating the label of a much
    # larger bare clade.
    coverage_threshold: 0.5
  phyloxml:
    # <confidence> element's type= attribute. "auto" picks "sh_like" for
    # FastTree and "ufboot" for IQ-TREE (which matches the default tree
    # arguments). Override only if you've changed the tree arguments —
    # e.g. classical bootstrap → "bootstrap", IQ-TREE -alrt only → "sh_alrt".
    confidence_type: auto

output:
  dir: ./repseq_output
  prefix: repseq
